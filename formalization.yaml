# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4, for Palomar (https://palomar-registry.org/).
version: "v0.4"

project:
  name: "The localization scale of the block Anderson model in one dimension at arbitrary coupling and volume"
  description: >-
    A Lean 4 / Mathlib proof of the main results of Yin, "The Localization Scale of the Block
    Anderson Model in One Dimension at Arbitrary Coupling and Volume" (arXiv:2611.09776). The
    model is H = (g (S + S^{-1}) tensor I_W + diag(V_1, ..., V_L)) / max{1, g} on C^L tensor C^W,
    with independent GUE blocks V_a of size W and the cyclic shift S of Z_L. Theorem 1.4: for
    0 < kappa < 1/2 and all D, tau > 0, for all large W, every L >= 3 and every coupling g >= 0,
    the expected fraction of the eigenvalues in the bulk energy set J_{g,kappa,L} that are simple
    and whose eigenvector has localization length between W^{-tau} l and W^{tau} l, where
    l = min{WL, max{W, W^2 g^2}}, is at least 1 - W^{-D}. Corollary 1.5: if also L <= W^{B_L},
    then with probability at least 1 - W^{-D} this holds for every eigenvalue in J_{g,kappa,L}.
    No result of another work is assumed; every result that the paper uses is proved in the
    library from Mathlib.
  authors:
    - "Jun Yin"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Jun Yin"

classification:
  arxiv: ["math.PR", "math-ph"]
  msc2020: ["60B20", "82B44", "47B80"]

sources:
  - title: "The Localization Scale of the Block Anderson Model in One Dimension at Arbitrary Coupling and Volume"
    authors:
      - "Jun Yin"
    id: "arXiv:2611.09776"
    type: "paper"
    location: "https://arxiv.org/abs/2611.09776"
    relationship: "formalizes"
    note: >-
      The Lean code follows paper/localization-scale-1d-block-anderson.pdf in this repository;
      equation and theorem numbers in docs/PAPER-VS-LEAN.md refer to it. The author of the paper
      is the author of the formalization.
    license: "unknown"
    author_endorsement: "participated"

related_formalizations: []

status:
  scope: >-
    Formalized: Theorem 1.4 ((1.17), both the lower and the upper bound on the localization
    length) and Corollary 1.5 ((1.18)), together with the results they rest on (Lemmas 1.2 and
    1.3, the count forms (2.12) and (3.11), Theorems 3.1–3.4). The statements are in uniform
    form: the parameters are fixed and a threshold W_0 is given, instead of families g(W), L(W).
    Not formalized: the weak continuity of g -> nu_g and the limit laws (1.11), which no proof
    uses. docs/PAPER-VS-LEAN.md, Section 4.5, lists the results of the paper with no Lean
    statement.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5", "claude-sonnet-5-5", "claude-fable-5-1", "claude-fable-5-2"]
      framework: "Claude Code"
      tool_setup: >-
        AI-assisted: a team of Claude Code agents (a dispatcher, workers on ticket worktrees and
        reviewing agents) wrote the Lean code and the comparison documents from the paper's
        source, under the direction of Jun Yin, who fixed the endpoint statements. The port to the
        Lean module system and the Challenge/Solution files for Palomar were also written with
        Claude.
      cost:
        wall_time: "about 164 hours of active work between 2026-10-25 and 2026-11-06 (744 commits in the work repository; the run was paused for long stretches in between)"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    The mathematical source is a paper by Jun Yin. The Lean proofs were produced by AI agents;
    the statements of the main theorems and of the definitions they use were fixed and checked by
    Jun Yin against the paper.

fidelity:
  divergences: >-
    (1) Uniform form: parameters fixed, then a threshold W_0, instead of sequences g(W), L(W).
    (2) The threshold in J_{g,kappa,L} is any L_1 >= L_0 in Theorem 1.4 and any fixed L_0 in
    Corollary 1.5. (3) In Theorem 1.4 the ratio is a real division with x/0 = 0, a multiple
    eigenvalue counts as not good, and all tau > 0 are allowed. (4) Corollary 1.5 is stated as a
    bound on the (outer) measure of the bad event. (5) Total functions: quantities defined for
    Hermitian matrices are 0 otherwise, and m_g, nu_g have junk values where the defining
    conditions would fail; the library proves that they do not fail. (6) Some proofs take a
    different route from the paper (fixed times instead of Brownian paths in Section 5).
    Details: docs/PAPER-VS-LEAN.md, Sections 2 and 4.

review:
  status: "agent-reviewed"
  reviewers: []
  notes: >-
    The Lean proof of each ticket was audited by a separate auditing agent, and a supervising
    agent checked the final statements. Jun Yin checked the statements of the main theorems and
    of the definitions they use against the paper. No independent human review has been
    performed.

alignment:
  namespace: "LSBA"
  statements:
    - source: "Theorem 1.4, (1.17)"
      lean: "LSBA.thm1_4"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution.lean by LSBA.main_ratio_endpoint."
    - source: "Corollary 1.5, (1.18)"
      lean: "LSBA.cor1_5"
      module: "Challenge"
      status: "proved"
      note: "Proved by LSBA.simultaneous_endpoint."

acknowledgements: "Mathlib and the Lean community; Lean 4 (Lean FRO); Claude Code (Anthropic)."
